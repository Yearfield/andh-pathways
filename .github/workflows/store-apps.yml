# Builds the Android and iOS store apps and checks, inside the real app on an emulator / simulator,
# that Alternative Medicine is gone and that both kinds of PDF open (printable cards and user-loaded guidelines).
# Screenshots, logs and an installable Android debug APK are attached to each run.
name: Store apps
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: SELFTEST=1 npm run build && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: .github/scripts/android-selftest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: |
            out/android
            android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: SELFTEST=1 npm run build && npx cap sync ios
      - name: Build for the simulator (unsigned)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -30
      - run: .github/scripts/ios-selftest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: out/ios
